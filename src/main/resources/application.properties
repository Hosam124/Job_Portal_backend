spring.application.name=Job_Portal_backend
spring.config.import=optional:file:.env[.properties]

logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){green} %clr(%-5level){blue} %clr([%thread]){red} %clr(%logger{15}){yellow} - %clr(%msg%n){cyan}


spring.datasource.url=jdbc:mysql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
# Provide safe defaults so missing environment variables don't break startup. If you run
# the app against MySQL set the corresponding env vars or update these values.
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}

