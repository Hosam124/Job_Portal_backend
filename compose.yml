services:
  dbservice:
    image: mysql:latest
    container_name: my-container
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "${DATABASE_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
    volumes:
      - /home/hossam-elleithy/DevZone/Backend/Java/spring/mysqldb:/var/lib/mysql
    env_file:
      - .env
